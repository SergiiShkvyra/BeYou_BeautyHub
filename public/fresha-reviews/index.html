<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Helper hop only: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening Fresha reviews… | BeYou Beauty Hub</title>
    <!--
      Why this page exists: the Fresha app claims every fresha.com/a/... venue
      URL (see fresha.com/.well-known/apple-app-site-association and
      assetlinks.json), so a tapped Fresha link on a phone opens the app,
      which ignores ?reviews=true and never shows the reviews. The
      Testimonials "Fresha" link taps THIS page instead (our own domain, which
      no app claims), and this page forwards to Fresha by itself, without a
      tap. App links only trigger on user-initiated navigation, so the
      forward stays in the browser, where ?reviews=true opens the Reviews view.
      Keep FRESHA_REVIEWS_URL in sync with src/components/Testimonials.tsx
      and tests/e2e/helpers.ts.
    -->
    <meta
      http-equiv="refresh"
      content="1; url=https://www.fresha.com/a/beyou-beauty-hub-arlington-arlington-3865-wilson-boulevard-idzdd7ex?pId=2531140&amp;reviews=true"
    />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f2e6; /* brand cream */
        color: #262c20; /* brand olive-ink */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 0 16px;
      }
      a { color: #505e47; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>
      Opening our Fresha reviews…<br />
      <a id="go" href="https://www.fresha.com/a/beyou-beauty-hub-arlington-arlington-3865-wilson-boulevard-idzdd7ex?pId=2531140&amp;reviews=true">Tap here if nothing happens</a>
    </p>
    <script>
      (function () {
        var url = document.getElementById('go').href;
        // Safety net: if a phone still hands Fresha to its app, this tab stays
        // behind on this page. When the visitor comes back to the browser and
        // the tab is visible again, close it, so they land back on the site
        // tab instead of a leftover "Opening…" tab. (A tab opened from a
        // link with a single history entry may close itself.)
        var wasHidden = false;
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') {
            wasHidden = true;
          } else if (wasHidden) {
            window.close();
          }
        });
        // replace(): no history entry, so Back from Fresha returns to the site.
        window.location.replace(url);
      })();
    </script>
  </body>
</html>
